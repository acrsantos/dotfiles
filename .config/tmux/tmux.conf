set -g default-terminal "$TERM"
set -ag terminal-overrides ",$TERM:Tc"
set -g mouse on

set-option -g status-style bg=white
set-option -g default-shell /bin/zsh

# Set prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Start windows and panes index at 1, not 0.
set -g base-index 1
setw -g pane-base-index 1

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'

set -g status-left-length 40
set -g status-right ""

# set -g status-left "#[fg=blue,bg=#E0E2EA,bold] #S #[fg=blue,bg=default,nobold,noitalics,nounderscore]"
set -g status-left ""
set -g window-status-current-format "#[fg=black,bg=#E0E2EA]  #W  "
set -g window-status-format "#[fg=#93a1a1,bg=$BG1,nobold,noitalics,nounderscore]  #W  "
set -g window-status-separator ""
set -g renumber-windows on


# set vi-mode
set-window-option -g mode-keys vi

# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 
#"xclip -i -f -selection primary | xclip -i -selection clipboard"

bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9

set-option -g allow-rename on
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_path}'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
